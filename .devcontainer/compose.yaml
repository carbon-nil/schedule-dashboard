# The repository is mounted at the same path as on the host (LOCAL_WORKSPACE_FOLDER, written to .env by
# devcontainer.json's initializeCommand), and /workspaces/schedule-dashboard is a symlink to it (Dockerfile).
# Claude Code keys its session history by the physical working directory, so host and container share one
# history; the familiar /workspaces path still works for VS Code and the terminal.
services:
    workspace:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                LOCAL_WORKSPACE_FOLDER: ${LOCAL_WORKSPACE_FOLDER}
        command: sleep infinity
        volumes:
            - ..:${LOCAL_WORKSPACE_FOLDER}:cached
            - node-modules-root:${LOCAL_WORKSPACE_FOLDER}/node_modules
            - node-modules-frontend:${LOCAL_WORKSPACE_FOLDER}/frontend/node_modules
            - jvm-cache:/home/vscode/.cache
            - sbt-home:/home/vscode/.sbt
            - ivy-home:/home/vscode/.ivy2
            # Claude Code and Codex logins survive rebuilds.
            - claude-config:/home/vscode/.claude
            - codex-home:/home/vscode/.codex
            # SQLite database files for development, at the same path the backend uses in production.
            - sqlite-data:/data
        environment:
            # Keeps ~/.claude.json (login state) inside the claude-config volume, as in the official devcontainer.
            CLAUDE_CONFIG_DIR: /home/vscode/.claude

volumes:
    node-modules-root:
    node-modules-frontend:
    jvm-cache:
    sbt-home:
    ivy-home:
    claude-config:
    codex-home:
    sqlite-data:
